[project]
name = "grace"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch",
  "torchvision",
  "transformers",
  "trl",
  "peft",
  "accelerate",
  "datasets",
  "evaluate",
  "bitsandbytes",
  "einops",
  "sentence-transformers",
]

[dependency-groups]
dev = [
  "ipykernel",
  "jupyter",
  "matplotlib",
  "pandas",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true